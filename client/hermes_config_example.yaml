# Hermes CLI Configuration Example for Kaggle Ollama Setup
# Place in ~/.hermes/config.yaml or AppData/Local/hermes/config.yaml

model:
  default: "muse-glimmer-heretic:30b"
  provider: "custom"
  # Replace YOUR-NGROK-DOMAIN with your public ngrok domain (e.g. your-subdomain.ngrok-free.dev):
  base_url: "https:YOUR-NGROK-DOMAIN/v1"
  context_length: 65536
  ollama_num_ctx: 65536
